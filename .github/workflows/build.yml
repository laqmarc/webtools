name: Construeix i comprova

# Això NO desplega res, i no cal: el Plesk fa git pull del repositori, així
# que el push ja és el desplegament. Per això la feina d'aquest workflow és
# una altra — evitar que un push publiqui alguna cosa trencada:
#
#   · el registre i les traduccions són consistents
#   · cap canònica apunta a localhost
#   · el lloc comès és idèntic al que produeix una construcció nova
#
# L'última és la important: sense ella, editar un text i no reconstruir deixa
# el lloc servint la versió vella sense que res ho digui.

env:
  SITE: https://webtools.quexulo.cat

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # La clau és el hash del guió, que és l'únic lloc on hi ha les versions:
      # la cache es refresca exactament quan toca i ni un push abans.
      - name: Recupera les llibreries de la cache
        id: vendor-cache
        uses: actions/cache@v4
        with:
          path: vendor
          key: vendor-${{ hashFiles('scripts/vendor.mjs') }}

      - name: Baixa les llibreries
        if: steps.vendor-cache.outputs.cache-hit != 'true'
        run: node scripts/vendor.mjs --extras

      - name: Comprova el registre i les traduccions
        run: node scripts/check.mjs

      - name: Construeix el lloc
        run: node scripts/dist.mjs --site "$SITE"

      # La canònica apuntant a localhost ja ha passat un cop i és invisible
      # des del navegador. Ara falla aquí.
      - name: Comprova les canòniques
        run: |
          if grep -rlE 'localhost|127\.0\.0\.1' dist/index.html dist/sitemap.xml dist/robots.txt dist/es/index.html dist/en/index.html; then
            echo "::error::Hi ha canòniques que apunten a localhost."
            exit 1
          fi
          echo "Canòniques sobre $SITE"

      # El desplegament és un git pull al docroot: el que hi ha comès surt
      # publicat. Si no coincideix amb una construcció nova, el push publicaria
      # pàgines velles, així que això ha de fallar, no avisar.
      - name: El lloc comès ha d'estar al dia
        run: node scripts/verify-build.mjs --site "$SITE"

      - uses: actions/upload-artifact@v4
        with:
          name: lloc
          path: dist
          retention-days: 7
